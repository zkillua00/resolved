[package]
name = "api-tester"
version = "0.1.0"
edition = "2024"
description = "A native macOS API client built with GPUI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
futures = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-wry = "=0.5.0"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "rustls",
    "system-proxy",
    "zstd",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
wry = "=0.53.3"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"
