[package]
name = "api-tester"
version = "0.1.0"
edition = "2024"
description = "A native macOS API client built with GPUI"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
csscolorparser = "=0.8.3"
cssparser = "=0.37.0"
dirs = "6.0"
futures = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-wry = "=0.5.0"
libc = "0.2"
lsp-types = "=0.97.0"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "brotli",
    "charset",
    "deflate",
    "gzip",
    "http2",
    "multipart",
    "rustls",
    "stream",
    "system-proxy",
    "zstd",
] }
rquickjs = { version = "=0.12.1", default-features = false, features = ["std"] }
rquickjs-serde = "=0.6.1"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
wry = "=0.53.3"

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
gpui-component = { path = "vendor/gpui-component-0.5.1" }
