[package]
name = "api-tester"
version = "0.7.1"
edition = "2024"
description = "A native desktop API workbench that keeps request intent, wire state, and responses explicit"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
bytes = "=1.12.1"
chrono = { version = "0.4", features = ["serde"] }
csscolorparser = "=0.8.3"
cssparser = "=0.37.0"
dirs = "6.0"
dprint-plugin-typescript = "=0.96.1"
futures = "0.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = { version = "=0.5.1", features = ["tree-sitter-languages"] }
gpui-wry = "=0.5.0"
lsp-types = "=0.97.0"
markdown = "=1.0.0"
memchr = "2.7"
quick-xml = "0.41"
roxmltree = "0.20"
reqwest = { version = "=0.13.4", default-features = false, features = [
    "brotli",
    "charset",
    "cookies",
    "deflate",
    "gzip",
    "http2",
    "json",
    "multipart",
    "rustls-no-provider",
    "stream",
    "system-proxy",
    "zstd",
] }
cookie_store = "=0.22.1"
ring = "=0.17.14"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
rquickjs = { version = "=0.12.1", default-features = false, features = ["std", "parallel", "loader"] }
rquickjs-serde = "=0.6.1"
rusqlite = { version = "=0.40.1", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "=0.25.10"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-kotlin-ng = "=1.1.0"
tree-sitter-php = "=0.24.2"
tree-sitter-powershell = "=0.26.4"
url = { version = "2.5", features = ["serde"] }
wry = "=0.53.3"
zeroize = "=1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "=0.10.0"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gdkx11 = "=0.18.2"
gtk = "=0.18.2"
x11 = { version = "=2.21.0", features = ["xlib"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[features]
default = []
macos = []

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support"] }
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"

[patch.crates-io]
gpui = { path = "vendor/gpui-0.2.2" }
gpui-component = { path = "vendor/gpui-component-0.5.1" }
gpui-wry = { path = "vendor/gpui-wry-0.5.0" }
tree-sitter-c-sharp = { path = "vendor/tree-sitter-c-sharp-0.23.5" }
tree-sitter-cpp = { path = "vendor/tree-sitter-cpp-0.23.4" }
tree-sitter-swift = { path = "vendor/tree-sitter-swift-0.7.3" }
tree-sitter-kotlin-ng = { path = "vendor/tree-sitter-kotlin-ng-1.1.0" }
tree-sitter-scala = { path = "vendor/tree-sitter-scala-0.23.4" }
tree-sitter-sequel = { path = "vendor/tree-sitter-sequel-0.3.11" }
